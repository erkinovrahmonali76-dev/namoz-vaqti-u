<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>YO'LDOSH UZ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #111);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center; padding: 24px; box-sizing: border-box;
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 6px 0; color: var(--tg-theme-hint-color, #666); }
  </style>
</head>
<body>
  <div>
    <div style="font-size:56px">🚗</div>
    <h1>YO'LDOSH UZ</h1>
    <p id="hello">Ilova ishlayapti ✅</p>
    <p>Tez orada: e'lon berish, qidirish va joy band qilish.</p>
  </div>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (u) document.getElementById("hello").textContent = "Salom, " + u.first_name + "! Ilova ishlayapti ✅";
    }
  </script>
</body>
</html>
