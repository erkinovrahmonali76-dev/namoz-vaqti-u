<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>YO'LDOSH UZ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f3f6; --surface: #ffffff; --ink: #12161c; --mute: #6b7380; --line: #e3e6ec;
    --asphalt: #12161c; --brand: #ffc933; --brand-ink: #12161c;
    --teal: #0d9488; --danger: #e5484d; --r: 20px;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 28px -14px rgba(16,24,40,.22);
  }
  :root[data-theme="dark"] {
    --bg: #0d1015; --surface: #171b22; --ink: #f2f4f7; --mute: #8d96a3; --line: #262c36;
    --shadow: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 500 15px/1.4 Manrope, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  header { background: var(--asphalt); color: #fff; padding: 18px 18px 44px;
    border-radius: 0 0 28px 28px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 42px; height: 42px; border-radius: 13px; background: var(--brand); display: grid;
    place-items: center; font-size: 22px; transform: rotate(-6deg); }
  header h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: .2px; }
  header p { margin: 1px 0 0; color: #9aa3b2; font-size: 12.5px; }
  .road { height: 3px; margin-top: 16px; border-radius: 3px; opacity: .9;
    background: repeating-linear-gradient(90deg, var(--brand) 0 14px, transparent 14px 26px); }

  main { padding: 4px 14px calc(100px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }

  nav { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 5;
    display: flex; gap: 4px; padding: 6px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 24px; box-shadow: 0 12px 32px -10px rgba(0,0,0,.35); max-width: 616px; margin: 0 auto; }
  nav button { flex: 1; background: none; border: 0; border-radius: 18px; padding: 8px 2px 7px; color: var(--mute);
    font: inherit; font-size: 10.5px; font-weight: 700; cursor: pointer; transition: background .15s, color .15s; }
  nav button svg { display: block; margin: 0 auto 2px; width: 22px; height: 22px; fill: none; stroke: currentColor;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  nav button.on { background: var(--brand); color: var(--brand-ink); }

  .searchbox { position: relative; margin-top: -30px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); }
  .searchbox input, .searchbox select { background: var(--bg); }
  .searchbox .field { margin-bottom: 0; }
  .swap { display: flex; align-items: center; gap: 8px; }
  .swap .pair { flex: 1; display: grid; gap: 8px; min-width: 0; }
  .swap .flip { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font-size: 18px; cursor: pointer; }

  .card { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 16px; margin: 12px 0; box-shadow: var(--shadow); }
  .trip { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
  .trip .pt { font-weight: 800; font-size: 18px; line-height: 1.15; }
  .trip .pt.end { text-align: right; }
  .trip .line { position: relative; height: 2px; min-width: 28px; opacity: .55;
    background: repeating-linear-gradient(90deg, var(--mute) 0 5px, transparent 5px 10px); }
  .trip .line span { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -52%);
    background: var(--surface); padding: 0 5px; font-size: 15px; }
  .when { margin-top: 8px; color: var(--mute); font-size: 13.5px; font-weight: 600; }
  .perf { position: relative; margin: 14px -16px 12px; border-top: 2px dashed var(--line); }
  .perf::before, .perf::after { content: ""; position: absolute; top: -10px; width: 18px; height: 18px;
    border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
  .perf::before { left: -10px; } .perf::after { right: -10px; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
  .price { font-weight: 800; font-size: 20px; }
  .chip { display: inline-block; background: var(--bg); border-radius: 999px; padding: 3px 11px;
    font-size: 12.5px; font-weight: 700; color: var(--mute); margin: 0 6px 6px 0; }
  .chip.ok { color: var(--teal); background: color-mix(in srgb, var(--teal) 14%, transparent); }
  .chip.bad { color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, transparent); }
  .note { font-size: 13.5px; margin-top: 2px; color: var(--ink); opacity: .8; }
  .pax { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; font-size: 13.5px; }
  .pax div { margin: 4px 0; }

  .field { margin: 12px 0; }
  .field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--mute); margin-bottom: 5px; }
  input, select, textarea { width: 100%; padding: 12px 14px; font: inherit; font-weight: 600; color: var(--ink);
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; outline: none;
    transition: border-color .15s; }
  input::placeholder, textarea::placeholder { color: var(--mute); font-weight: 500; opacity: .8; }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); }
  .two { display: flex; gap: 10px; } .two > * { flex: 1; min-width: 0; }

  .btn { display: block; width: 100%; padding: 14px; border: 0; border-radius: 16px; cursor: pointer;
    background: var(--brand); color: var(--brand-ink); font: inherit; font-weight: 800; font-size: 15px;
    margin-top: 14px; transition: transform .1s; }
  .btn:active { transform: scale(.98); }
  .btn.small { display: inline-block; width: auto; padding: 10px 18px; margin: 0; font-size: 14px; border-radius: 14px; }
  .btn.ghost { background: transparent; color: var(--danger); border: 1.5px solid var(--line); }
  .btn:disabled { opacity: .55; }
  a { color: var(--teal); font-weight: 700; text-decoration: none; }

  .opt { display: block; width: 100%; text-align: left; padding: 13px 14px; margin: 7px 0; border-radius: 14px;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 600;
    cursor: pointer; }
  .opt.on { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 16%, transparent); font-weight: 800; }

  .empty { text-align: center; color: var(--mute); padding: 44px 12px; font-weight: 600; }
  h2 { font-size: 22px; font-weight: 800; margin: 22px 2px 6px; }

  #toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-size: 13.5px;
    font-weight: 700; max-width: 88%; text-align: center; z-index: 30; opacity: 0; pointer-events: none;
    transition: opacity .2s; }
  #toast.show { opacity: 1; }

  #sheet { position: fixed; inset: 0; z-index: 20; display: none; background: rgba(8, 10, 14, .55); }
  #sheet.open { display: flex; align-items: flex-end; justify-content: center; }
  #sheet .panel { position: relative; background: var(--surface); width: 100%; max-width: 640px;
    border-radius: 28px 28px 0 0; padding: 26px 18px calc(20px + env(safe-area-inset-bottom));
    max-height: 90vh; overflow: auto; animation: up .22s ease-out; }
  #sheet .panel::before { content: ""; position: absolute; top: 9px; left: 50%; width: 40px; height: 4px;
    margin-left: -20px; border-radius: 4px; background: var(--line); }
  #sheet h3 { margin: 0 0 4px; font-size: 19px; font-weight: 800; }
  @keyframes up { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #sheet .panel { animation: none; } }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">🚗</div>
      <div><h1>YO'LDOSH UZ</h1><p>Shaharlararo yo'lovchi va haydovchilar</p></div>
    </div>
    <div class="road"></div>
  </header>
  <main id="view"></main>
  <nav id="tabs">
    <button data-tab="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Qidirish</button>
    <button data-tab="post"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>E'lon berish</button>
    <button data-tab="mine"><svg viewBox="0 0 24 24"><path d="M3 13l2-6h14l2 6v5h-3v-2H6v2H3z"/><circle cx="7.5" cy="13" r=".6"/><circle cx="16.5" cy="13" r=".6"/></svg>E'lonlarim</button>
    <button data-tab="bookings"><svg viewBox="0 0 24 24"><path d="M4 7h16v3a2 2 0 000 4v3H4v-3a2 2 0 000-4z"/><path d="M14 7v10" stroke-dasharray="2 2"/></svg>Bronlarim</button>
  </nav>
  <div id="toast"></div>
  <div id="sheet"><div class="panel" id="panel"></div></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

function applyTheme() {
  const dark = tg && tg.colorScheme ? tg.colorScheme === "dark"
    : window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  try { tg.setHeaderColor("#12161c"); tg.setBackgroundColor(dark ? "#0d1015" : "#f2f3f6"); } catch (e) {}
}
applyTheme();
if (tg && tg.onEvent) tg.onEvent("themeChanged", applyTheme);

const MONTHS = ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
const view = document.getElementById("view");
const state = { tab: "search", q: { from: "", to: "", day: "" } };
let CHANNEL_URL = "https://t.me/yoldoshuzz";

const DRIVER_REASONS = ["Mashina buzildi", "Rejalarim o'zgardi", "Yo'lovchi topilmadi",
  "E'lonni xato berdim", "Boshqa sabab"];
const PASSENGER_REASONS = ["Rejalarim o'zgardi", "Narxi qimmat", "Boshqa transport topdim",
  "Adashib band qildim", "Haydovchi bilan kelisha olmadim", "Boshqa sabab"];

/* ---------- Yordamchi funksiyalar ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

async function api(path, opts = {}) {
  const res = await fetch("/api" + path, {
    method: opts.method || "GET",
    headers: { "Content-Type": "application/json", "X-Init-Data": (tg && tg.initData) || "" },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const d = data && data.detail;
    if (d === "not_subscribed") { showSubscribe(); throw new Error("Kanalga obuna bo'ling"); }
    throw new Error(typeof d === "string" ? d : "Maydonlarni to'g'ri to'ldiring");
  }
  return data;
}

function showSubscribe() {
  closeSheet();
  document.getElementById("tabs").style.display = "none";
  view.replaceChildren(h("div", { class: "empty" },
    h("h2", {}, "📢 Kanalga obuna bo'ling"),
    h("p", {}, "Ilovadan foydalanish uchun bizning kanalga obuna bo'lishingiz kerak."),
    h("button", { class: "btn", onclick: () => {
      if (tg && tg.openTelegramLink) tg.openTelegramLink(CHANNEL_URL); else window.open(CHANNEL_URL);
    } }, "Kanalga o'tish"),
    h("button", { class: "btn ghost", style: "color:var(--ink)", onclick: () => location.reload() },
      "✅ Obuna bo'ldim, tekshirish")
  ));
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 2600);
}

function money(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " so'm"; }

function fmtDT(iso) {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Asia/Tashkent", day: "numeric", month: "numeric",
    hour: "2-digit", minute: "2-digit", hour12: false,
  }).formatToParts(new Date(iso));
  const g = (t) => parts.find((p) => p.type === t).value;
  const hh = g("hour") === "24" ? "00" : g("hour");
  return g("day") + "-" + MONTHS[+g("month") - 1] + ", " + hh + ":" + g("minute");
}

function todayTashkent() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tashkent" }).format(new Date());
}

function normPhone(s) {
  const d = s.replace(/\D/g, "");
  if (d.length === 9) return "+998" + d;
  if (d.length === 12 && d.startsWith("998")) return "+" + d;
  return s.trim();
}

function savedPhone() { try { return localStorage.getItem("phone") || ""; } catch (e) { return ""; } }
function savePhone(p) { try { localStorage.setItem("phone", p); } catch (e) {} }

function haptic(kind) { try { tg.HapticFeedback.notificationOccurred(kind); } catch (e) {} }

async function load(container, fn) {
  container.replaceChildren(h("div", { class: "empty" }, "Yuklanmoqda…"));
  try { await fn(); } catch (e) { container.replaceChildren(h("div", { class: "empty" }, e.message)); }
}

/* ---------- Pastdan chiqadigan oyna ---------- */
const sheet = document.getElementById("sheet");
const panel = document.getElementById("panel");
sheet.addEventListener("click", (e) => { if (e.target === sheet) closeSheet(); });
function openSheet(...content) { panel.replaceChildren(...content); sheet.classList.add("open"); }
function closeSheet() { sheet.classList.remove("open"); }

/* ---------- Bekor qilish sababini so'rash ---------- */
function askReason(title, reasons, onSubmit) {
  let chosen = "";
  const other = h("textarea", { rows: "2", maxlength: "150", placeholder: "Sababini yozing",
    style: "display:none;margin-top:8px" });
  const btn = h("button", { class: "btn" }, "Bekor qilish");
  const opts = reasons.map((r) => {
    const b = h("button", { class: "opt", type: "button" }, r);
    b.onclick = () => {
      chosen = r;
      opts.forEach((o) => o.classList.toggle("on", o === b));
      other.style.display = r === "Boshqa sabab" ? "block" : "none";
    };
    return b;
  });
  btn.onclick = async () => {
    const reason = chosen === "Boshqa sabab" ? other.value.trim() : chosen;
    if (reason.length < 2) return toast("Sababni tanlang");
    btn.disabled = true;
    try { await onSubmit(reason); closeSheet(); }
    catch (e) { btn.disabled = false; toast(e.message); }
  };
  openSheet(h("h3", {}, title), ...opts, other, btn,
    h("button", { class: "btn ghost", style: "color:var(--ink)", onclick: closeSheet }, "Orqaga"));
}

/* ---------- Umumiy kartalar ---------- */
let PLACES = ["Andijon", "Buxoro", "Farg'ona", "Jizzax", "Namangan", "Navoiy", "Qashqadaryo", "Qo'qon",
  "Samarqand", "Sirdaryo", "Surxondaryo", "Toshkent", "Xorazm", "Yaypan"];

function placeSelect(value, placeholder) {
  const sel = h("select", {}, h("option", { value: "" }, placeholder),
    ...PLACES.map((p) => h("option", { value: p }, p)));
  sel.value = value || "";
  return sel;
}

function rideHeader(r) {
  return [
    h("div", { class: "trip" },
      h("div", { class: "pt" }, r.from_place),
      h("div", { class: "line" }, h("span", {}, "🚗")),
      h("div", { class: "pt end" }, r.to_place)),
    h("div", { class: "when" }, "🕒 " + fmtDT(r.depart_at)),
    h("div", { class: "perf" }),
  ];
}

function isPast(r) { return new Date(r.depart_at) <= new Date(); }

/* ---------- 1. Qidirish ---------- */
function viewSearch() {
  const from = placeSelect(state.q.from, "Qayerdan (hammasi)");
  const to = placeSelect(state.q.to, "Qayerga (hammasi)");
  const day = h("input", { type: "date", value: state.q.day, min: todayTashkent() });
  const results = h("div");

  const run = () => {
    state.q = { from: from.value.trim(), to: to.value.trim(), day: day.value };
    const qs = "from_place=" + encodeURIComponent(state.q.from) +
      "&to_place=" + encodeURIComponent(state.q.to) + "&day=" + encodeURIComponent(state.q.day);
    load(results, async () => {
      const rides = await api("/rides?" + qs);
      if (!rides.length) {
        results.replaceChildren(h("div", { class: "empty" }, "Hozircha mos e'lon yo'q.", h("br"),
          "Boshqa sana yoki yo'nalishni sinab ko'ring."));
        return;
      }
      results.replaceChildren(...rides.map(searchCard));
    });
  };

  const flip = h("button", { class: "flip", type: "button", "aria-label": "Almashtirish", onclick: () => {
    const t = from.value; from.value = to.value; to.value = t;
  } }, "⇅");

  view.replaceChildren(
    h("div", { class: "searchbox" },
      h("div", { class: "swap" }, h("div", { class: "pair" }, from, to), flip),
      h("div", { class: "field" }, h("label", {}, "Sana (ixtiyoriy)"), day),
      h("button", { class: "btn", onclick: run }, "Qidirish")),
    results
  );
  run();
}

function searchCard(r) {
  return h("div", { class: "card" },
    rideHeader(r),
    h("div", {},
      h("span", { class: "chip ok" }, "💺 " + r.seats_left + " ta joy"),
      r.car && h("span", { class: "chip" }, "🚘 " + r.car),
      h("span", { class: "chip" }, "👤 " + r.driver_name)
    ),
    r.note && h("div", { class: "note" }, r.note),
    h("div", { class: "row" },
      h("span", { class: "price" }, money(r.price)),
      h("button", { class: "btn small", onclick: () => openBook(r) }, "Band qilish")
    )
  );
}

function openBook(r) {
  const seats = h("select", {}, ...Array.from({ length: Math.min(r.seats_left, 8) }, (_, i) =>
    h("option", { value: i + 1 }, String(i + 1))));
  const phone = h("input", { type: "tel", placeholder: "+998 90 123 45 67", value: savedPhone() });
  const btn = h("button", { class: "btn" }, "Band qilish");

  btn.onclick = async () => {
    btn.disabled = true;
    try {
      const p = normPhone(phone.value);
      const res = await api("/rides/" + r.id + "/book", { method: "POST", body: { seats: +seats.value, phone: p } });
      savePhone(p);
      haptic("success");
      openSheet(
        h("h3", {}, "Band qilindi ✅"),
        h("p", {}, "Haydovchi sizning raqamingizni oldi va siz bilan bog'lanadi."),
        h("p", {}, "Haydovchi telefoni: ", h("a", { href: "tel:" + res.driver_phone }, res.driver_phone)),
        h("button", { class: "btn", onclick: () => { closeSheet(); viewSearch(); } }, "Yopish")
      );
    } catch (e) {
      btn.disabled = false;
      haptic("error");
      toast(e.message);
    }
  };

  openSheet(
    h("h3", {}, r.from_place + " → " + r.to_place),
    h("div", { class: "when" }, "🕒 " + fmtDT(r.depart_at) + " · " + money(r.price) + " (bir joy)"),
    h("div", { class: "two" },
      h("div", { class: "field" }, h("label", {}, "Joy soni"), seats),
      h("div", { class: "field" }, h("label", {}, "Telefoningiz"), phone)
    ),
    btn
  );
}

/* ---------- 2. E'lon berish ---------- */
function viewPost() {
  const from = placeSelect("", "Tanlang");
  const to = placeSelect("", "Tanlang");
  const day = h("input", { type: "date", min: todayTashkent(), value: todayTashkent() });
  const time = h("input", { type: "time", value: "08:00" });
  const seats = h("select", {}, ...[1, 2, 3, 4, 5, 6, 7, 8].map((n) =>
    h("option", { value: n, selected: n === 3 }, String(n))));
  const price = h("input", { type: "number", inputmode: "numeric", min: "0", step: "1000", placeholder: "150000" });
  const car = h("input", { type: "text", placeholder: "Masalan: Cobalt, oq", maxlength: "40" });
  const phone = h("input", { type: "tel", placeholder: "+998 90 123 45 67", value: savedPhone() });
  const note = h("textarea", { rows: "2", maxlength: "200", placeholder: "Masalan: yukxona bor, qo'shimcha bagaj yo'q" });
  const btn = h("button", { class: "btn" }, "E'lonni joylash");

  btn.onclick = async () => {
    if (!from.value || !to.value) return toast("Qayerdan va qayerga ni tanlang");
    if (from.value === to.value) return toast("Qayerdan va qayerga bir xil bo'lmasin");
    if (!day.value || !time.value) return toast("Sana va vaqtni kiriting");
    if (price.value === "") return toast("Narxni kiriting");
    btn.disabled = true;
    try {
      const p = normPhone(phone.value);
      await api("/rides", { method: "POST", body: {
        from_place: from.value, to_place: to.value, depart_at: day.value + "T" + time.value,
        seats: +seats.value, price: +price.value, car: car.value, phone: p, note: note.value,
      } });
      savePhone(p);
      haptic("success");
      toast("E'lon joylandi va kanalga yuborildi ✅");
      go("mine");
    } catch (e) {
      btn.disabled = false;
      haptic("error");
      toast(e.message);
    }
  };

  const f = (label, el) => h("div", { class: "field" }, h("label", {}, label), el);
  view.replaceChildren(
    h("h2", {}, "Yangi e'lon"),
    f("Qayerdan", from), f("Qayerga", to),
    h("div", { class: "two" }, f("Sana", day), f("Vaqt", time)),
    h("div", { class: "two" }, f("Bo'sh joylar", seats), f("Narx (bir joy, so'm)", price)),
    f("Mashina (ixtiyoriy)", car),
    f("Telefon raqamingiz", phone),
    f("Izoh (ixtiyoriy)", note),
    btn
  );
}

/* ---------- 3. Mening e'lonlarim ---------- */
function viewMine() {
  const box = h("div");
  view.replaceChildren(h("h2", {}, "Mening e'lonlarim"), box);
  load(box, async () => {
    const rides = await api("/my/rides");
    if (!rides.length) {
      box.replaceChildren(h("div", { class: "empty" }, "Hali e'lon bermagansiz."));
      return;
    }
    box.replaceChildren(...rides.map(mineCard));
  });
}

function mineCard(r) {
  const past = isPast(r);
  const status = r.status === "cancelled" ? ["Bekor qilingan", "bad"]
    : past ? ["O'tgan", ""] : ["Faol", "ok"];
  const pax = r.passengers.length
    ? h("div", { class: "pax" }, h("b", {}, "Yo'lovchilar:"),
        ...r.passengers.map((p) => h("div", {}, p.name + " · " + p.seats + " joy · ",
          h("a", { href: "tel:" + p.phone }, p.phone))))
    : null;
  const canCancel = r.status === "open" && !past;

  return h("div", { class: "card" },
    rideHeader(r),
    h("div", {},
      h("span", { class: "chip " + status[1] }, status[0]),
      h("span", { class: "chip" }, "💺 bo'sh: " + r.seats_left + " / " + r.seats),
      h("span", { class: "chip" }, money(r.price))
    ),
    pax,
    canCancel && h("div", { class: "row" }, h("span"),
      h("button", { class: "btn small ghost", onclick: () => askReason(
        "E'lonni nima uchun bekor qilyapsiz?", DRIVER_REASONS,
        async (reason) => {
          await api("/rides/" + r.id + "/cancel", { method: "POST", body: { reason } });
          toast("Bekor qilindi"); viewMine();
        }) }, "Bekor qilish"))
  );
}

/* ---------- 4. Mening bronlarim ---------- */
function viewBookings() {
  const box = h("div");
  view.replaceChildren(h("h2", {}, "Mening bronlarim"), box);
  load(box, async () => {
    const items = await api("/my/bookings");
    if (!items.length) {
      box.replaceChildren(h("div", { class: "empty" }, "Hali joy band qilmagansiz."));
      return;
    }
    box.replaceChildren(...items.map(bookingCard));
  });
}

function bookingCard(b) {
  const past = isPast(b);
  const active = b.booking_status === "active";
  const status = !active ? ["Bekor qilingan", "bad"] : past ? ["O'tgan", ""] : ["Band qilingan", "ok"];

  return h("div", { class: "card" },
    rideHeader(b),
    h("div", {},
      h("span", { class: "chip " + status[1] }, status[0]),
      h("span", { class: "chip" }, "💺 " + b.booked_seats + " joy"),
      h("span", { class: "chip" }, money(b.price * b.booked_seats))
    ),
    active && h("div", { class: "note" }, "Haydovchi: " + b.driver_name + " · ",
      h("a", { href: "tel:" + b.driver_phone }, b.driver_phone)),
    active && !past && h("div", { class: "row" }, h("span"),
      h("button", { class: "btn small ghost", onclick: () => askReason(
        "Bronni nima uchun bekor qilyapsiz?", PASSENGER_REASONS,
        async (reason) => {
          await api("/bookings/" + b.booking_id + "/cancel", { method: "POST", body: { reason } });
          toast("Bron bekor qilindi"); viewBookings();
        }) }, "Bekor qilish"))
  );
}

/* ---------- Navigatsiya ---------- */
const views = { search: viewSearch, post: viewPost, mine: viewMine, bookings: viewBookings };

function go(tab) {
  state.tab = tab;
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  window.scrollTo(0, 0);
  views[tab]();
}

document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => go(b.dataset.tab)));

(async function init() {
  if (!tg || !tg.initData) {
    document.getElementById("tabs").style.display = "none";
    view.replaceChildren(h("div", { class: "empty" },
      "Bu ilovani Telegram ichidan oching.", h("br"), "Botga /start yozing va «Ilovani ochish» tugmasini bosing."));
    return;
  }
  try {
    const data = await api("/places");
    if (data.channel_url) CHANNEL_URL = data.channel_url;
    if (Array.isArray(data.places) && data.places.length) PLACES = data.places;
  } catch (e) { /* takliflarsiz ham ishlaydi */ }

  // Majburiy obuna: obuna bo'lmasa api() o'zi showSubscribe() ni chiqaradi
  try { await api("/me"); } catch (e) { return; }
  go("search");

  // Kanal postidan kelgan bo'lsa: shu e'lonning band qilish oynasini ochamiz (?ride=123)
  const rideId = new URLSearchParams(location.search).get("ride");
  if (rideId && /^\d+$/.test(rideId)) {
    try { openBook(await api("/rides/" + rideId)); }
    catch (e) { toast(e.message); }
  }
})();
</script>
</body>
</html>
